name: Regulation Watch

# Weekly metadata-only check for suspected Saudi regulation updates.
# الفحص الأسبوعي لإشارات تحديث الأنظمة السعودية (بيانات وصفية فقط).
#
# Policy: this workflow NEVER copies or interprets legal text and NEVER
# edits sources/ or datasets/. On suspicion it files a human-verification
# Issue; a licensed Saudi attorney must confirm before any content PR.
# Authoritative text: boe.gov.sa + Official Gazette uqn.gov.sa.

on:
  schedule:
    # Sundays 06:00 UTC = 09:00 KSA — before the work week.
    - cron: "0 6 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  watch:
    name: Check regulation signals
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install checker dependency
        run: pip install requests

      - name: Run regulation-watch check
        id: watch
        run: |
          set +e
          python3 scripts/check_regulation_updates.py --check \
            --report regulation-watch-report.md \
            --update-state-if-clean > watch-output.txt 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          set -e
          cat watch-output.txt

      - name: Ensure watch labels exist
        # gh issue create fails when labels are missing (fresh repos).
        if: steps.watch.outputs.exit_code == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create "legal-source" \
            --description "Saudi regulation source reference" \
            --color "0E8A16" --force
          gh label create "content-update" \
            --description "Regulation content update" \
            --color "FBCA04" --force

      - name: Check for an already-open watch issue (dedupe)
        if: steps.watch.outputs.exit_code == '1'
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NUM=$(gh issue list --state open \
            --search "[Regulation Watch] suspected update signals in:title" \
            --json number --jq '.[0].number // empty')
          echo "number=${NUM}" >> "$GITHUB_OUTPUT"
          if [ -z "${NUM}" ]; then echo "No open watch issue."; else echo "Open watch issue: #${NUM}"; fi

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: regulation-watch-report
          path: |
            regulation-watch-report.md
            watch-output.txt
          retention-days: 90

      - name: Commit refreshed baseline (only when clean)
        # --update-state-if-clean freezes the baseline whenever a signal
        # awaits human review, so a commit here means "no suspicion".
        if: steps.watch.outputs.exit_code == '0'
        run: |
          if git status --porcelain | grep -q "evals/.regulation-watch-state.json"; then
            git config user.name "regulation-watch[bot]"
            git config user.email "regulation-watch[bot]@users.noreply.github.com"
            git add evals/.regulation-watch-state.json
            git commit -m "chore: refresh regulation-watch baseline [skip ci]" \
              -m "Weekly metadata-only fingerprint refresh. No legal content changed."
            git push
          else
            echo "Baseline unchanged — nothing to commit."
          fi

      - name: File human-verification issue (on suspicion, no duplicate)
        if: steps.watch.outputs.exit_code == '1' && steps.existing.outputs.number == ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE=$(date -u +%Y-%m-%d)
          BODY=$(cat regulation-watch-report.md)
          gh issue create \
            --title "[Regulation Watch] suspected update signals — ${DATE}" \
            --label "legal-source,content-update" \
            --body "## تنبيه آلي / Automated signal (NOT legal advice)

          رصد الفحص الأسبوعي إشارات وصفية دقيقة (صفحة نظام / جريدة رسمية)
          يُشتبه أن تكون تحديثًا تشريعيًا.
          **يُمنع تعديل أي ملف قبل تحقق محامٍ مرخّص.**

          The weekly check observed exact-confidence metadata signals of
          suspected regulatory change.
          **No file may be edited until a licensed attorney verifies.**

          ### Required human steps
          1. Open each SUSPECT exact-confidence URL below (laws.boe.gov.sa → uqn.gov.sa gazette link → named document).
          2. Compare decree number + article text with \`sources/regulation-index.md\` and the listed \`source_file\`.
          3. If confirmed: update \`sources/regulation-index.md\` FIRST, then \`sources/…md\`, then datasets (\`deprecated\`/\`superseded\` per \`docs/legal-verification-lifecycle.md\`); open a PR with official links.
          4. After the decision is recorded, refresh the baseline: \`python3 scripts/check_regulation_updates.py --check --update-state\`.

          ### Issue template
          Use for each confirmed change: [.github/ISSUE_TEMPLATE/legal-source-reference.yml](.github/ISSUE_TEMPLATE/legal-source-reference.yml)

          ---

          ${BODY}"

      - name: Comment on the open watch issue (instead of a duplicate)
        if: steps.watch.outputs.exit_code == '1' && steps.existing.outputs.number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment "${{ steps.existing.outputs.number }}" \
            --body-file regulation-watch-report.md
